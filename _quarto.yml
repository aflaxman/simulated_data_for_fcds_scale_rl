project:
  type: default
  render: [paper.qmd]

execute:
  freeze: auto        # store computed output; re-execute only when the code changes
  echo: false         # hide code by default; opt in per-chunk with #| echo: true
  warning: false

bibliography: references.bib
csl: ijpds.csl

format:
  # html is listed first because Quarto treats the FIRST format as the default —
  # so `quarto preview` (and Ctrl+Shift+K in VS Code) serve HTML without
  # needing --to html. The docx submission artifact is built explicitly via
  # `make paper` / `quarto render --to docx`.
  html:                         # self-contained copy to share / preprint
    toc: true
    number-sections: true       # so @sec- cross-references resolve in both formats
    embed-resources: true
    code-fold: true
  docx:                         # the IJPDS submission artifact
    reference-doc: reference-doc.docx
    number-sections: true
    fig-cap-location: bottom
    tbl-cap-location: top
    fig-dpi: 300                # Word gets print-resolution PNGs (the default is 96 dpi); swap for fig-format: svg if the journal accepts vector figures
