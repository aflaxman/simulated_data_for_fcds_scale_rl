# Single source of truth for paths and randomness.
#
# Anything the pipeline reads or writes is named here, and every stochastic step
# takes its seed from here, so a headline number can always be traced back to a
# (path, seed) pair recorded in one place.

dataset:
  name: sim_fcds_benchmark
  version: "0.4"

paths:
  # The full-scale simulated USA population that pseudopeople reads. Read-only.
  psp_source: /mnt/team/simulation_science/pub/models/vivarium_census_prl_synth_pop/results/release_02_yellow/full_data/united_states_of_america/2023_08_21_16_35_27/final_results/2023_08_31_15_58_01/pseudopeople_simulated_population_usa_2_0_0/
  # Where the released CSVs live. Big data never enters the repo.
  release_dir: /ihme/homes/abie/notebook/2026/data/sim_fcds_benchmark_0.4
  # Scratch for staged Parquet handed to pseudopeople.
  scratch: /ihme/homes/abie/notebook/2026/data/temp_psp_processing
  # Small committed summaries the paper reads.
  results: results
  # The age/sex distribution the registry stand-in is drawn to match exactly,
  # stratum by stratum: the `count` column of this table, as shares. Since
  # 2026-09-24 that is the distribution of cases reported by FCDS (the author's
  # call: the registry's own age/sex pattern is the target). The 2026-08-12
  # build instead *weighted* a random draw by GBD prevalence
  # (reference/gbd_neoplasm_prevalence_florida.csv, kept as a QA comparator).
  age_sex_target: reference/fcds_incidence_by_age_sex.csv

seeds:
  # Salted into md5_number_lower() for DuckDB's keyed-hash draws (stratum quotas, finders).
  duckdb_sample: 42
  # pseudopeople noise seeds, one per output file.
  psp_registry: 42
  psp_finder: 1
  # Keyed hash placing each registry record's diagnosis date within its census year.
  diagnosis_date: 2026

cohorts:
  # State the extract is filtered to, and which census records feed each file.
  # The registry stand-in is drawn from the *last-seen pool*: every simulant ever
  # recorded in Florida in one of these censuses, once, at their last appearance,
  # so it holds people who have since died or left the state, as a registry does
  # (decision 2026-09-24, replacing living 2020 residents only). The finder files
  # are drawn from residents in `finder_year`.
  state: FL
  census_years: [2020, 2030, 2040]
  registry_pool: last_seen
  finder_year: 2040
  registry_target: 5_000_000
  finder_500k_target: 500_000
  finder_100k_target: 100_000
  overlap_500k_target: 100_000
  overlap_100k_target: 20_000
  # The two finder files share no simulants (by construction of the draw since
  # v0.4; the v0.2 files accidentally shared 2,508).
  overlap_finder_finder_target: 0

noise:
  # Rates are the second author's specification (working notebook, 2026-02-02:
  # "the same customization as in the FCDS 2024 monograph"): a finder-file
  # submission against the registry's own consolidated file. pseudopeople's
  # default cell noise (1% per mechanism per field) applies on top. Confirm the
  # monograph's citation before publication (OUTLINE needs-verification #4).
  registry:
    # The realised rate is 0.0568, not 0.05 (2026-09-24 build): 4.18% of the
    # last-seen pool never held an SSN in the source population, and the older
    # registry draw concentrates them, so the structural floor (5.68%) already
    # exceeds the target and the pipeline blanks nothing further.
    ssn_missing: 0.05
    ssn_transposed: 0.00
    address_missing: 0.01
  finder:
    ssn_missing: 0.20
    ssn_transposed: 0.01
    address_missing: 0.05
  # pseudopeople's row noise drops or duplicates whole rows: non-response (1.45% by
  # default, targeted by race, age and sex), omit-row (0 by default) and
  # duplicate-with-guardian (a child's record copied to a guardian's address). A
  # registry holds every case it registered and a cohort roster lists every member,
  # so none has a counterpart here; all three are off (duplication since 2026-10-01,
  # the rest since 2026-10-04), each file holds exactly the people drawn, and the
  # build asserts that pseudopeople returned the staged rows. Any change here
  # re-draws pseudopeople's cell noise across the whole file.
  row_noise:
    do_not_respond: 0.0
    omit_row: 0.0
    duplicate_with_guardian: 0.0
