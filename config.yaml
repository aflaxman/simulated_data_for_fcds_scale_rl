# Single source of truth for paths and randomness.
#
# Anything the pipeline reads or writes is named here, and every stochastic step
# takes its seed from here, so a headline number can always be traced back to a
# (path, seed) pair recorded in one place.

dataset:
  name: sim_cancer_registry_linkage_benchmark
  version: "0.3"

paths:
  # The full-scale simulated USA population that pseudopeople reads. Read-only.
  psp_source: /mnt/team/simulation_science/pub/models/vivarium_census_prl_synth_pop/results/release_02_yellow/full_data/united_states_of_america/2023_08_21_16_35_27/final_results/2023_08_31_15_58_01/pseudopeople_simulated_population_usa_2_0_0/
  # Where the released CSVs live. Big data never enters the repo.
  release_dir: /ihme/homes/abie/notebook/2026/data/sim_cancer_registry_linkage_benchmark_0.3
  # Scratch for staged Parquet handed to pseudopeople.
  scratch: /ihme/homes/abie/notebook/2026/data/temp_psp_processing
  # Small committed summaries the paper reads.
  results: results
  # Age- and sex-specific rates that weight the registry draw (only relative
  # weights matter). FCDS cancer incidence since 2026-09-24 (the author's call:
  # the registry's own age/sex pattern is the more relevant target); the
  # 2026-08-12 build used reference/gbd_neoplasm_prevalence_florida.csv, which
  # is kept as the comparator for the age/sex QA figure. The FCDS-weighted
  # rebuild keeps the v0.3 number (nothing was released) and is pending;
  # results/ describe the 2026-08-12 build until it runs (build_cohorts.py --force).
  age_sex_weights: reference/fcds_incidence_by_age_sex.csv

seeds:
  # Salted into md5_number_lower() for DuckDB's weighted sampling.
  duckdb_sample: 42
  # pseudopeople noise seeds, one per output file.
  psp_registry: 42
  psp_finder: 1
  # numpy RNG for exact-target downsampling and SSN noise.
  postprocess: 999

cohorts:
  # State and census year the Florida extract is filtered to.
  state: FL
  year: 2020
  # Cohorts are drawn oversize because pseudopeople's omission noise drops rows;
  # exact targets are enforced afterwards by stratified trimming
  # (src/simulated_data_for_fcds_scale_rl/downsample.py). The v0.2 build trimmed
  # unstratified and overshot the overlap targets by roughly a third; the v0.3
  # build (pipeline/build_cohorts.py, run 2026-08-12) hits every target exactly
  # and passed the run-twice checksum identity test.
  oversample: 1.5
  registry_target: 5_000_000
  finder_500k_target: 500_000
  finder_100k_target: 100_000
  overlap_500k_target: 100_000
  overlap_100k_target: 20_000
  # The two finder files share no simulants (enforced by stratified_trim from
  # v0.3 on; the v0.2 files accidentally share 2,508).
  overlap_finder_finder_target: 0

noise:
  # Rates follow the FCDS 2024 monograph characterisation of a finder-file
  # submission versus the registry's own data quality. Confirm the monograph
  # citation before publication.
  registry:
    # The realised v0.3 rate is 0.0578, not 0.05: 4.99% of Florida simulants
    # never held an SSN in the source population, and the cancer-weighted (older)
    # registry draw concentrates them, so the structural floor (5.78%) already
    # exceeds the target and the pipeline blanks nothing further.
    ssn_missing: 0.05
    ssn_transposed: 0.00
    address_missing: 0.01
  finder:
    ssn_missing: 0.20
    ssn_transposed: 0.01
    address_missing: 0.05
